    """ (Optional) If the transcript is not available, use Taddy's on-demand transcription feature to generate one. Default is true. On-demand transcription takes ~10 seconds for every 1 hour of audio transcribed. Also, consider using getEpisodeTranscript to offload getting the transcript to another query. 
    """
    useOnDemandCreditsIfNeeded: Boolean

    """ (Optional) Only return a transcript if it is provided by the podcast itself. If the podcast does not provide a transcript, Taddy will not generate one and will return null instead. Takes precedence over useOnDemandCreditsIfNeeded. Default is false. 
    """
    useOnlyPodcastProvidedTranscript: Boolean
  ): [TranscriptItem]

  """ Taddy's unique identifier (an uuid) """
