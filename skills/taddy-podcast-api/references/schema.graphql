    """
    useOnDemandCreditsIfNeeded: Boolean

    """ (Optional) Only return a transcript if it is provided by the podcast itself. If the podcast does not provide a transcript, Taddy will not generate one and will return null instead. Takes precedence over useOnDemandCreditsIfNeeded. Default is false. 
