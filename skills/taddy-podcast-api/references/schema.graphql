  """ A list of PodcastSeries items """
  podcastSeries: [PodcastSeries]

  """ The platform to check for top charts content """
  source: TopChartsSource @deprecated(reason: "Not needed")

  """ The type of content """
  taddyType: TaddyType @deprecated(reason: "Not needed")

  """ Identifier for the top charts query being sent (Used for caching) """
  topChartsId: ID!
}

enum TopChartsSource {
  APPLE_PODCASTS
}

enum TopChartsType {
  COUNTRY
  GENRE
}

""" Each line of the transcript """
type TranscriptItem {
  """ The end timecode of the transcript item in milliseconds """
  endTimecode: Int

  """ The unique identifier for the transcript item """
  id: ID

  """ The speaker of the transcript item """
  speaker: String

  """ The start timecode of the transcript item in milliseconds """
  startTimecode: Int

  """ The text of the transcript item """
  text: String
}

""" Style of the transcript """
enum TranscriptItemStyle {
  PARAGRAPH
  UTTERANCE
}

""" A url link to the transcript for an episode """
type TranscriptLink {
  """ (Optional) If the transcript has timecodes """
  hasTimecodes: Boolean

  """ If the transcript is exclusive to Taddy API Business users and you need an API key to access it 
  """
  isTaddyExclusive: Boolean

  """ (Optional) The language of the transcript """
  language: String

  """ Mime type of file """
  type: String

  """ The url to the transcript """
  url: String
}

""" User Details for Developer Application Details """
type UserWebhooks {
  """ The user id for the dev app"""
  userId: ID

  """ A list of all the dev Apps for a user"""
  webhooks: [Webhook]
}

""" Webhook Details """
type Webhook {
  """ Date created (Epoch time in seconds) """
  createdAt: Int

  """ URL for the webhook """
  endpointUrl: String

  """Events that get triggered for the webhook"""
  events: [String]

  """ Filters for this webhook (OR logic between filters) """
  filters: [WebhookFilter]

  """ The unique identifier for the webhook """
  id: ID!

  """If the webhook is active or not"""
  isActive: Boolean

  """If the webhook is verified or not"""
  isVerified: Boolean

  """ Secret for the webhook """
  webhookSecret: String
}

""" Type of webhook action """
enum WebhookEventActionType {
  created
  deleted
  feed_updated
  new_content_released
  new_episodes_released
  new_issues_released
  updated
}

""" A filter for a webhook (one row = one event type + clauses) """
type WebhookFilter {
  """ Clause 1 as one string: 'field1' MATCHES 'value1', with the regex exactly as stored. Null when the clause is not set. To compare with your own field and regex, split on the first ' MATCHES ' and remove the outer single quotes 
  """
  clause1: String

  """ Clause 2, same format as clause1 
  """
  clause2: String

  """ Clause 3, same format as clause1 
  """
  clause3: String

  """ Clause 4, same format as clause1 
  """
  clause4: String

  """ Clause 5, same format as clause1 
  """
  clause5: String

  """ The label you gave the filter 
  """
  description: String

  """ The event type this filter applies to (e.g. podcastepisode.created) 
  """
  eventType: String!

  """ BlockList entries 
  """
  excludedUuids: [String]

  """ True if the filter has a BlockList 
  """
  hasExcludedUuids: Boolean

  """ True if the filter has an AllowList 
  """
  hasIncludedUuids: Boolean

  """ AllowList entries 
  """
  includedUuids: [String]

  """ The unique identifier for the filter 
  """
  uuid: ID!

  """ The webhook this filter belongs to 
  """
  webhookId: ID
}

""" Input for creating/updating a filter. See references/webhook-filters.md for the fields you can filter on """
input WebhookFilterInput {
  """ (Optional) A label for this filter. Not used for matching, so you can store your own key in it (e.g. watchlist:AAPL:name) 
  """
  description: String

  """ The event type this filter applies to, in the form taddyType.action (e.g. podcastepisode.created). Must be an event type the webhook is subscribed to 
  """
  eventType: String!

  """ (Optional) BlockList: content from these podcasts never matches. Each entry is a podcast uuid, rssUrl or itunesId 
  """
  excludedUuids: [String]

  """ (Optional) Clause 1: a field from the event payload (e.g. name, description, podcastSeries.genres). Valid fields depend on the taddyType in eventType. Must be set together with value1 
  """
  field1: String

  """ (Optional) Clause 2, see field1 
  """
  field2: String

  """ (Optional) Clause 3, see field1 
  """
  field3: String

  """ (Optional) Clause 4, see field1 
  """
  field4: String

  """ (Optional) Clause 5, see field1 
  """
  field5: String

  """ (Optional) AllowList: only content from these podcasts matches. Each entry is a podcast uuid, rssUrl or itunesId 
  """
  includedUuids: [String]

  """ (Optional) Clause 1: the regex that field1 must match. Case-insensitive, matched anywhere in the value, max 500 characters; * is not allowed (use .+ or a bounded repeat). All clauses in a filter must match (AND); any filter may match (OR) 
  """
  value1: String

  """ (Optional) Clause 2, see value1 
  """
  value2: String

  """ (Optional) Clause 3, see value1 
  """
  value3: String

  """ (Optional) Clause 4, see value1 
  """
  value4: String

  """ (Optional) Clause 5, see value1 
  """
  value5: String
}

""" Websub Details """
type WebsubDetails {
  """ If the websub notification is currently active """
  isVerified: Boolean

  """ The feed url for the websub """
  topicUrl: String

  """ Taddy's unique identifier """
  uuid: ID

  """ The url for the hub where you get the websub notification """
  websubHubUrl: String
}

""" iTunes Info for a podcast """
type iTunesInfo {
  """ Base Url to the podcast's cover art from iTunes. NOTE: To get a working image, you need to pass in a size at the end of the url in the format {baseArtworkUrl}{size}x{size}bb.png ex {baseArtworkUrl}640x640bb.png 
  """
  baseArtworkUrl: String

  """ Helper Url to the podcast's cover art from iTunes. Pass in an interger for the size of the image you want 
  """
  baseArtworkUrlOf(size: Int): String

  """ Country where the podcast is made """
  country: Country

  """ A different hash signals that itunes information has changed since the last hash 
  """
  hash: String

  """ PodcastSeries linked to this iTunesInfo """
  podcastSeries: PodcastSeries

  """ Publisher Id from iTunes. Typed as Float (not Int) to support 64-bit integers 
  """
  publisherId: Float

  """ Publisher name from iTunes """
  publisherName: String

  """ Subtitle given in Apple Podcasts """
  subtitle: String

  """ Summary given in Apple Podcasts """
  summary: String

  """ PodcastSeries unique identifier linked to this iTunesInfo """
  uuid: ID
}
