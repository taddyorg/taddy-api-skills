""" Directive to override the default cost of a field """
directive @cost(value: Float!) on FIELD_DEFINITION

""" Directive to override the default cost factor (list multiplier) of a field 
"""
directive @costFactor(value: Float!) on FIELD_DEFINITION

""" An alternate enclosure for a podcast episode (from the tag <podcast:alternateEnclosure> in the RSS feed). 
"""
type AlternateEnclosureLink {
  """ (Optional) Bitrate of media """
  bitrate: String

  """ (Optional) RFC 6381 codec string """
  codecs: String

  """ (Optional) If true, this is the same content as the standard enclosure 
  """
  default: Boolean

  """ (Optional) Height in pixels (for video) """
  height: Int

  """ (Optional) BCP 47 language tag """
  lang: String

  """ File size in bytes. Typed as Float (not Int) to support 64-bit integers (very large files) 
  """
  length: Float

  """ (Optional) Relationship/grouping identifier """
  rel: String

  """ (Optional) Content type of this specific source, if different from the media type 
  """
  sourceContentType: String

  """ (Optional) Human-readable title """
  title: String

  """ MIME type of the media """
  type: String

  """ URI to the media file """
  uri: String
}

""" Chapters (Sections) that make up the podcast episode """
type Chapter {
  """ The unique identifier for the chapter """
  id: ID

  """ The start timecode of the chapter in milliseconds """
  startTimecode: Int

  """ The title of the chapter """
  title: String
}

""" A url link to the chapters for an episode """
type ChapterLink {
  """ If the transcript is exclusive to Taddy API Business users and you need an API key to access it 
  """
  isTaddyExclusive: Boolean

  """ Mime type of file """
  type: String

  """ The url to the chapter """
  url: String
}

